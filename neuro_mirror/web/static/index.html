<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нейро-зеркало</title>
    <!-- Значок вкладки и окна: логотип (вектор) и запасной PNG -->
    <link rel="icon" type="image/svg+xml" href="/static/assets/logo.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/static/assets/logo-64.png" />
    <!-- Шрифты поставляются с программой: обращений в сеть при запуске нет -->
    <link rel="stylesheet" href="/static/fonts/fonts.css?v=20261002-unbounded" />
    <!-- Стили: tokens → base → shell → components → screens -->
    <link rel="stylesheet" href="/static/css/tokens.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/base.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/shell.css?v=20261002-logo3" />
    <link rel="stylesheet" href="/static/css/components/placeholder.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/components/card.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/components/button.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/components/stepper.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/components/dialog.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/components/san.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/components/panel.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/components/check-list.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/components/progress.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/components/notice.css?v=20260930-mirror" />
    <link rel="stylesheet" href="/static/css/components/hads.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/components/moca.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/components/tabs.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/components/domain.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/screens/home.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/screens/welcome.css?v=20261002-v3b" />
    <link rel="stylesheet" href="/static/css/screens/screening.css?v=20260925-fit5" />
    <link rel="stylesheet" href="/static/css/screens/test.css?v=20260930-mirror" />
    <link rel="stylesheet" href="/static/css/screens/reports.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/screens/service.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/screens/tasks.css?v=20260925-fit4" />
    <link rel="stylesheet" href="/static/css/screens/training.css?v=20260930-free2" />
    <link rel="stylesheet" href="/static/css/screens/game.css?v=20261002-v3b" />
    <link rel="stylesheet" href="/static/css/screens/practice.css?v=20261001-gm20" />  </head>
  <body data-nm-sidebar-collapsed="true">
    <div class="nm-app">
      <div class="nm-shell" id="nm-shell">
        <header class="nm-header">
          <div class="nm-header-brand">
            <img class="nm-header-logo" src="/static/assets/logo.svg" alt="" />
            <span class="nm-header-name">Нейро-зеркало</span>
          </div>
          <div class="nm-header-status">
            <!-- #user-chip перенесён сюда из старой шапки без изменений -->
            <button type="button" class="status-pill user-chip" id="user-chip" title="Сменить пользователя" hidden>
              <img class="user-chip-avatar" id="user-chip-avatar" src="" alt="" />
              <span id="user-chip-name">—</span>
            </button>
            <!-- Запись для набора данных: видна всё время, пока идёт запись (цвет + значок + текст) -->
            <span class="nm-status-pill nm-recording-pill" id="dataset-recording" role="status" hidden>
              <span class="nm-status-dot" data-state="off" aria-hidden="true"></span>
              <span>Идёт запись</span>
            </span>
            <span class="nm-status-pill" id="nm-mic-status">
              <span class="nm-status-dot" id="nm-mic-status-dot" data-state="unknown" aria-hidden="true"></span>
              <span id="nm-mic-status-text">Микрофон: неизвестно</span>
            </span>
          </div>
        </header>
        <div class="nm-body">
          <nav class="nm-sidebar" id="nm-sidebar" aria-label="Основная навигация" data-collapsed="true">
            <button type="button" class="nm-sidebar-toggle" id="nm-sidebar-toggle" aria-expanded="false" aria-controls="nm-sidebar-nav">
              <svg class="nm-nav-item-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true">
                <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" />
              </svg>
              <span class="nm-sidebar-toggle-label">Развернуть меню</span>
            </button>
            <ul class="nm-nav" id="nm-sidebar-nav"></ul>
          </nav>
          <script>
            // Menu opened earlier stays open; applied before the first drawing,
            // so it does not slide open on every reload (js/shell.js keeps it)
            try {
              if (localStorage.getItem("nm-sidebar-collapsed") === "false") {
                document.getElementById("nm-sidebar").dataset.collapsed = "false";
                document.body.dataset.nmSidebarCollapsed = "false";
                document.getElementById("nm-sidebar-toggle").setAttribute("aria-expanded", "true");
                document.querySelector(".nm-sidebar-toggle-label").textContent = "Свернуть меню";
              }
            } catch (_) {}
          </script>
          <main class="nm-workarea" id="nm-workarea">
            <h1 class="nm-workarea-title" id="nm-workarea-title" tabindex="-1"></h1>
            <div class="nm-workarea-content" id="nm-workarea-content"></div>
          </main>
        </div>
      </div>

      <!-- Единый поток камеры: невидим, но не display:none — с него снимаются
           кадры для проверки лица, пульса (rPPG) и записи набора данных -->
      <div class="nm-offscreen" aria-hidden="true">
        <video id="camera-preview" autoplay playsinline muted></video>
      </div>

      <!-- Выбор камеры и микрофона: форма живёт на служебном экране
           (js/screens/service.js) и переносится туда при его открытии -->
      <div id="nm-service-holder" hidden>
        <form id="devices-form" class="device-form">
          <div class="device-field">
            <label for="camera-select" class="device-label mono">Камера</label>
            <select id="camera-select" class="device-select"></select>
          </div>
          <div class="device-field">
            <label for="microphone-select" class="device-label mono">Микрофон</label>
            <select id="microphone-select" class="device-select"></select>
          </div>
          <p id="devices-status" class="device-status placeholder-text">Каталог устройств загружается...</p>
          <div id="devices-errors" class="device-errors" hidden></div>
          <div class="device-actions">
            <button type="button" id="devices-refresh" class="icon-btn"><span>Обновить</span></button>
            <button type="submit" id="devices-save" class="icon-btn primary-btn">
              <span>Подтвердить</span>
            </button>
          </div>
        </form>
      </div>

      <div class="user-gate" id="user-gate" hidden>
        <div class="user-gate-panel">
          <!-- View 1: user selection -->
          <section class="user-gate-view" id="user-select-view">
            <h2 class="user-gate-title">Кто перед зеркалом?</h2>
            <p class="user-gate-sub">Выберите профиль или создайте новый</p>
            <div class="user-grid" id="user-grid"></div>
            <button type="button" class="icon-btn primary-btn user-create-open" id="user-create-open">
              <span>+ Новый пользователь</span>
            </button>
          </section>

          <!-- View 2: user creation -->
          <section class="user-gate-view" id="user-create-view" hidden>
            <h2 class="user-gate-title">Новый пользователь</h2>
            <p class="user-gate-sub">ID будет присвоен автоматически</p>

            <form id="user-create-form" class="user-create-form">
              <div class="user-field">
                <label class="device-label mono" for="user-name-input">Имя</label>
                <input type="text" id="user-name-input" class="user-name-input" maxlength="60" placeholder="Как к вам обращаться?" autocomplete="off" />
              </div>

              <div class="user-field">
                <span class="device-label mono">Аватар</span>
                <div class="avatar-picker" id="avatar-picker"></div>
                <div class="avatar-photo-row">
                  <button type="button" class="icon-btn" id="avatar-photo-btn"><span>Сделать фото</span></button>
                  <span class="avatar-photo-hint mono" id="avatar-photo-hint"></span>
                </div>
                <div class="avatar-camera" id="avatar-camera" hidden>
                  <video id="avatar-camera-video" autoplay playsinline muted></video>
                  <div class="avatar-camera-actions">
                    <button type="button" class="icon-btn primary-btn" id="avatar-capture-btn"><span>Снять</span></button>
                    <button type="button" class="icon-btn" id="avatar-camera-cancel"><span>Отмена</span></button>
                  </div>
                </div>
              </div>

              <label class="consent-row" for="user-consent-personal">
                <input type="checkbox" id="user-consent-personal" />
                <span id="consent-text-personal">Я даю согласие на обработку персональных данных.</span>
              </label>
              <label class="consent-row" for="user-consent-audio">
                <input type="checkbox" id="user-consent-audio" />
                <span id="consent-text-audio">Я даю согласие на запись и временную обработку аудиоданных.</span>
              </label>
              <label class="consent-row" for="user-consent-video">
                <input type="checkbox" id="user-consent-video" />
                <span id="consent-text-video">Я даю согласие на запись и временную обработку видеоданных.</span>
              </label>
              <!-- Хранение записей: отдельное согласие, по умолчанию выключено -->
              <label class="consent-row" for="user-consent-dataset">
                <input type="checkbox" id="user-consent-dataset" />
                <span id="consent-text-dataset">Я даю согласие на сохранение аудио- и видеозаписей моего прохождения тестов для формирования исследовательского набора данных.</span>
              </label>

              <p class="user-create-error" id="user-create-error" hidden></p>

              <div class="user-create-actions">
                <button type="submit" class="icon-btn primary-btn" id="user-create-submit" disabled><span>Создать и войти</span></button>
                <button type="button" class="icon-btn" id="user-create-back" hidden><span>Назад</span></button>
              </div>
            </form>
          </section>
        </div>
      </div>
    </div>

    <script src="/static/app.js?v=20260930-mirror" defer></script>
    <script type="module" src="/static/js/shell.js?v=20261002-v3b"></script>
  </body>
</html>
